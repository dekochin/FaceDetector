name: Build and Release

on:
  push:
    tags:
      - 'v*' # v1.0.0 などのタグがプッシュされたときに自動実行
  workflow_dispatch: # GitHubのWeb画面から手動実行できるようにする

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 1. Qtのセットアップ (MinGW環境用)
      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.1' # お使いのQtバージョンに合わせて変更してください
          host: 'windows'
          target: 'desktop'
          arch: 'win64_mingw'

      # 2. MSYS2とMinGWツールチェイン・Ninjaのセットアップ
      - name: Setup MSYS2 MinGW
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: git mingw-w64-x86_64-toolchain mingw-w64-x86_64-cmake mingw-w64-x86_64-ninja

      # 3. OpenCVのキャッシュ設定
      - name: Cache OpenCV Binaries
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: C:/opencv
          key: ${{ runner.os }}-opencv-mingw-5.0.0-${{ hashFiles('**/CMakeLists.txt') }}

      # 4. キャッシュに存在しない場合のみ、GitHub ReleasesからOpenCVをダウンロードして展開
      - name: Download & Setup Custom OpenCV (if not cached)
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "C:/opencv" -Force
          Write-Host "Downloading pre-built OpenCV from GitHub Releases..."
          
          $opencvZipUrl = "https://github.com/dekochin/FaceDetector/releases/download/opencv-bin-v5.0.0/opencv-mingw.zip"
          
          Invoke-WebRequest -Uri $opencvZipUrl -OutFile "opencv-mingw.zip"
          Expand-Archive -Path "opencv-mingw.zip" -DestinationPath "C:/opencv" -Force
          Remove-Item "opencv-mingw.zip"

      # 5. CMakeの構成 (Ninja ジェネレータを指定、パスはMSYS2形式)
      - name: Configure CMake (Ninja)
        shell: msys2 {0}
        run: |
          cmake -B build -S . -G "Ninja" -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" \
            -DOpenCV_DIR="/c/opencv/mingw_install/x64/mingw"

      # 6. アプリケーションのビルド (Ninjaを使用)
      - name: Build Application
        shell: msys2 {0}
        run: |
          cmake --build build --config Release

      # 7. 配布用パッケージング（実行ファイル、Qt DLL、OpenCV/MinGW DLL、ONNXモデルの同梱）
      - name: Create Standalone Package
        shell: pwsh
        run: |
          $pubDir = "publish"
          New-Item -ItemType Directory -Path $pubDir -Force
          
          # A. 実行ファイルのコピー
          if (Test-Path "build/FaceDetector.exe") {
              Copy-Item "build/FaceDetector.exe" $pubDir/
          } elseif (Test-Path "build/src/FaceDetector.exe") {
              Copy-Item "build/src/FaceDetector.exe" $pubDir/
          } else {
              throw "Executable FaceDetector.exe not found in build directory!"
          }
          
          # B. YuNetのONNXモデルをHugging Faceの公式ミラーからダウンロード (LFS対策)
          Write-Host "Downloading YuNet ONNX model from Hugging Face..."
          $onnxUrl = "https://huggingface.co/opencv/face_detection_yunet/resolve/main/face_detection_yunet_2023mar.onnx"
          Invoke-WebRequest -Uri $onnxUrl -OutFile "$pubDir/face_detection_yunet_2023mar.onnx"
          
          # C. Qtの依存DLL・プラグインを収集
          $qtBin = "${{ env.Qt6_DIR }}/bin"
          & "$qtBin/windeployqt.exe" --release "$pubDir/FaceDetector.exe"

          # D. OpenCV (MinGWビルド版) のランタイムDLLをコピー
          Copy-Item "C:/opencv/mingw_install/x64/mingw/bin/libopencv_*.dll" $pubDir/

          # E. MinGWコンパイラのランタイムDLLを同梱（起動クラッシュ防止の必須項目）
          $mingwBin = "C:/msys64/mingw64/bin"
          Copy-Item "$mingwBin/libstdc++-6.dll" $pubDir/
          Copy-Item "$mingwBin/libgcc_s_seh-1.dll" $pubDir/
          Copy-Item "$mingwBin/libwinpthread-1.dll" $pubDir/

          # F. ZIP圧縮
          Compress-Archive -Path "$pubDir/*" -DestinationPath "FaceDetector-Windows-x64.zip"

      # 8. 動作確認用の成果物（Artifact）アップロード
      - name: Upload Artifact for Testing
        uses: actions/upload-artifact@v4
        with:
          name: FaceDetector-Package-Test
          path: FaceDetector-Windows-x64.zip

      # 9. GitHub Releasesへの自動アップロード (タグプッシュ時のみ動作)
      - name: Upload Release Asset
        uses: softprops/action-gh-release@v1
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          files: FaceDetector-Windows-x64.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}