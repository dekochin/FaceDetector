name: Build and Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v3
        with:
          version: '6.6.1'
          host: 'windows'
          target: 'desktop'
          arch: 'win64_msvc2019_64'

      - name: Cache OpenCV
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: C:/opencv
          key: ${{ runner.os }}-opencv-4.9.0

      - name: Download and Extract OpenCV
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        shell: pwsh
        run: |
          $opencvVersion = "4.9.0"
          $url = "https://github.com/opencv/opencv/releases/download/$opencvVersion/opencv-$opencvVersion-windows.exe"
          Invoke-WebRequest -Uri $url -OutFile "opencv-installer.exe"
          Start-Process -FilePath "opencv-installer.exe" -ArgumentList "-o C:\ -y" -Wait
          Remove-Item "opencv-installer.exe"

- name: Configure CMake
        run: |
          cmake -B build -S . -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_PREFIX_PATH="${{ env.Qt6_DIR }}" `
            -DOpenCV_DIR="C:/opencv/mingw_install/x64/mingw"

      - name: Build Application
        run: |
          cmake --build build --config Release

      - name: Create Standalone Package
        shell: pwsh
        run: |
          $pubDir = "publish"
          New-Item -ItemType Directory -Path $pubDir

          # 1. 実行ファイルのコピー
          Copy-Item "build/src/Release/FaceDetector.exe" $pubDir/

          # 2. ONNXモデルのコピー
          if (Test-Path "face_detection_yunet_2023mar.onnx") {
              Copy-Item "face_detection_yunet_2023mar.onnx" $pubDir/
          } else {
              Write-Warning "ONNX model file not found in root directory!"
          }

          # 3. Qtの依存DLLを収集
          & "${{ env.Qt6_DIR }}/bin/windeployqt.exe" --release "$pubDir/FaceDetector.exe"

          # 4. MinGW環境でインストールされたOpenCVのDLLをコピー
          # ※ C:/opencv/mingw_install/x64/mingw/bin 内の libopencv_*.dll をすべてコピー
          Copy-Item "C:/opencv/mingw_install/x64/mingw/bin/libopencv_*.dll" $pubDir/

          # 5. ZIP圧縮
          Compress-Archive -Path "$pubDir/*" -DestinationPath "FaceDetector-Windows-x64.zip"